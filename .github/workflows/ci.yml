name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Concurrency is declared per-job (not workflow-wide) so that a new push
# cancels the fast jobs but lets the multi-hour emulated s390x job finish;
# its successor queues instead.
env:
  MRUBY_CONFIG: .github/ci/build_config.rb

# Merging a PR pushes a merge commit whose tree the PR run just tested, so the
# push-triggered duplicate is skipped by matching the merge-commit message.
# Direct pushes (and everything else) run normally.
jobs:
  # Fail fast if a tool-generated session URL sneaks into the tree or into a
  # commit message — those identifiers must never be published. The tree grep
  # excludes this workflow (it must name the patterns).
  hygiene:
    name: no session URLs
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Merge pull request')
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-hygiene
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - name: Reject session URLs in files and recent commit messages
        run: |
          set -e
          pattern='claude\.ai/code|session_01|Claude-Session:'
          if git grep -nE "$pattern" -- . ':!.github/workflows/ci.yml'; then
            echo '::error::session URL found in the tree'; exit 1
          fi
          if git log -50 --format=%B | grep -nE "$pattern"; then
            echo '::error::session URL found in a commit message'; exit 1
          fi

  native:
    name: ${{ matrix.name }}
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Merge pull request')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.name }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64 (gcc + ASan/UBSan)
            os: ubuntu-latest
            toolchain: gcc
            sanitize: '1'
          - name: Linux x86_64 (clang)
            os: ubuntu-latest
            toolchain: clang
          - name: Linux arm64 (gcc)
            os: ubuntu-24.04-arm
            toolchain: gcc
          - name: macOS arm64 (clang)
            os: macos-latest
            toolchain: clang
          - name: macOS x86_64 (clang)
            os: macos-15-intel
            toolchain: clang
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake

      - name: Run test suite
        run: rake test
        env:
          MRUBY_TOOLCHAIN: ${{ matrix.toolchain }}
          MRUBY_SANITIZE: ${{ matrix.sanitize || '' }}

  musl:
    name: Linux x86_64 (musl, Alpine)
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Merge pull request')
    runs-on: ubuntu-latest
    container: alpine:latest
    timeout-minutes: 45
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-musl
      cancel-in-progress: true
    steps:
      # actions/checkout needs a glibc node runtime, which musl lacks, so
      # clone manually inside the container.
      - name: Install build dependencies
        run: apk add --no-cache build-base cmake git ruby ruby-rake linux-headers

      - name: Check out repository
        run: |
          git config --global --add safe.directory '*'
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --depth 1 origin "$GITHUB_SHA"
          git checkout FETCH_HEAD
          git submodule update --init --depth 1

      - name: Run test suite
        run: rake test
        env:
          MRUBY_TOOLCHAIN: gcc

  freebsd:
    name: FreeBSD 14 x86_64 (QEMU VM)
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Merge pull request')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-freebsd
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build and test in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: '14.3'
          usesh: true
          copyback: false
          # cmake's "Unix Makefiles" generator needs GNU make (gmake) on BSD
          prepare: pkg install -y git cmake gmake ruby rubygem-rake
          run: |
            set -e
            MRUBY_CONFIG=.github/ci/build_config.rb MRUBY_TOOLCHAIN=clang rake test

  s390x:
    name: Linux s390x big-endian (QEMU user emulation)
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Merge pull request')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    # Never cancel a running s390x job: everything is emulated, so a run
    # takes hours; a superseding push queues here instead.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-s390x
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Big-endian coverage: this gem parses DNS wire format, so s390x is the
      # most valuable emulated target. Everything (compiler included) runs
      # under qemu-user, so this job is slow but thorough.
      - name: Build and test on s390x
        uses: uraimo/run-on-arch-action@v3
        with:
          arch: s390x
          distro: ubuntu22.04
          githubToken: ${{ github.token }}
          install: |
            apt-get update -q -y
            apt-get install -q -y build-essential cmake git ruby rake
          run: |
            MRUBY_CONFIG=.github/ci/build_config.rb MRUBY_TOOLCHAIN=gcc rake test

  windows:
    # Runs the full mrbtest suite with MSVC. The network-fixture tests skip
    # themselves on Windows (Ares::WINDOWS): the IO.select event loop drives
    # POSIX fds while c-ares hands out winsock SOCKET handles. Non-blocking
    # until the suite proves stable on MSVC.
    name: Windows x64 (MSVC)
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Merge pull request')
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 60
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-windows
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # windows-toolchain: none keeps setup-ruby from installing the
      # MSYS2/MinGW devkit, whose coreutils `link` shadows MSVC's link.exe
      # and whose gcc headers leak into INCLUDE for the c-ares CMake build.
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          windows-toolchain: none

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Run test suite
        run: rake test
        env:
          MRUBY_TOOLCHAIN: visualcpp
